<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>ВкусДом</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header-top">
          <a class="header-logo" href="#" aria-label="На главную">
            <img
              class="logo"
              src="public/header/Logo_Primary.svg"
              alt="Логотип ВкусДом"
            />
          </a>

          <div class="search-wrap">
            <button class="catalog-btn">
              <img src="public\header\catalog.svg" alt="Иконка каталога" /><span
                >Каталог</span
              >
            </button>
            <img
              class="search-icon"
              src="public\header\search.svg"
              alt="Поиск"
            />
            <input class="search" type="text" placeholder="Поиск по сайту" />
          </div>

          <div class="header-actions" aria-label="Пользовательские действия">
            <button class="delivery-btn" type="button">
              <img
                src="public/header/geo.svg"
                alt=""
                aria-hidden="true"
                class="delivery-icon"
              />
              <span>Укажите способ получения</span>
            </button>

            <ul class="header-actions-list">
              <li class="header-actions-item favourite-link">
                <a href="#" aria-label="Избранное">
                  <img src="public/header/favourite.svg" alt="Избранное" />
                </a>
                <span class="favourite-count">1</span>
              </li>
              <li class="header-actions-item">
                <a
                  href="#"
                  class="header-action cart-link"
                  aria-label="Корзина"
                >
                  <img src="public/header/cart.svg" alt="Корзина" />
                </a>
              </li>
              <li class="header-actions-item">
                <a
                  href="#"
                  class="header-action user-link"
                  aria-label="Профиль"
                >
                  <img src="public/header/user.svg" alt="Профиль" />
                </a>
              </li>
            </ul>
          </div>
        </div>

        <nav class="header-menu" aria-label="Главное меню">
          <ul class="header-menu-list">
            <li class="header-menu-item"><a href="#">Акции</a></li>
            <li class="header-menu-item"><a href="#">Хиты продаж</a></li>
            <li class="header-menu-item"><a href="#">Новинки</a></li>
            <li class="header-menu-item">
              <a href="#">Сделано в Чеченской республике</a>
            </li>
            <li class="header-menu-item"><a href="#">Готовая еда</a></li>
            <li class="header-menu-item">
              <a href="#">Собственное производство</a>
            </li>
            <li class="header-menu-item"><a href="#">Овощи и фрукты</a></li>
            <li class="header-menu-item"><a href="#">Мясо</a></li>
            <li class="header-menu-item"><a href="#">Рыба</a></li>
            <li class="header-menu-item"><a href="#">Сыры</a></li>
            <li class="header-menu-item"><a href="#">Хлеб</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <section class="page-header">
          <div class="breadcrumb">
            <span class="breadcrumb__item">Главная</span>
            <img class="breadcrumb__separator" src="public\main\arrow.svg" />
            <span class="breadcrumb__item breadcrumb__item--current"
              >Бренды</span
            >
          </div>
          <div class="page-title-row">
            <button
              class="back-button"
              type="button"
              aria-label="Вернуться назад"
            >
              <img
                class="back-button__icon"
                src="public\main\CaretCircleRight.svg"
                alt="Кнопка назад"
              />
            </button>
            <h2 class="page-title">Бренды</h2>
          </div>
        </section>

        <section class="popular-brands">
          <h3 class="popular-brands__title">Популярные бренды</h3>
          <ul class="popular-brands__list">
            <li class="popular-brands__item">
              <a class="popular-brands__link" href="#"
                ><img
                  class="popular-brands__image"
                  src="public\brands\miratorg.png"
                  alt="Мираторг"
              /></a>
            </li>
            <li class="popular-brands__item">
              <a class="popular-brands__link" href="#"
                ><img
                  class="popular-brands__image"
                  src="public\brands\barilla.png"
                  alt="Барилла"
              /></a>
            </li>
            <li class="popular-brands__item">
              <a class="popular-brands__link" href="#"
                ><img
                  class="popular-brands__image"
                  src="public\brands\zelenayaLiniya.png"
                  alt="Зеленая линия"
              /></a>
            </li>
            <li class="popular-brands__item">
              <a class="popular-brands__link" href="#"
                ><img
                  class="popular-brands__image"
                  src="public\brands\gurme.png"
                  alt="Гурмэ"
              /></a>
            </li>
            <li class="popular-brands__item">
              <a class="popular-brands__link" href="#"
                ><img
                  class="popular-brands__image"
                  src="public\brands\perekrestok.png"
                  alt="Перекресток"
                />
              </a>
            </li>
            <li class="popular-brands__item">
              <a class="popular-brands__link" href="#"
                ><img
                  class="popular-brands__image"
                  src="public\brands\market.png"
                  alt="Market"
              /></a>
            </li>
            <li class="popular-brands__item">
              <a class="popular-brands__link" href="#"
                ><img
                  class="popular-brands__image"
                  src="public\brands\svyatoiIstochnik.png"
                  alt="Святой источник"
              /></a>
            </li>
          </ul>
        </section>

        <section class="letters">
          <ul class="letters__list">
            <li class="letters__item letters__item--numbers">
              <button class="letters__btn" type="button">0-9</button>
            </li>
            <li class="letters__item letters__item--active">

            </li>

            </li>
          </ul>
          <div class="letters__divider"></div>
        </section>
      </div>
    </main>

    <footer></footer>
  </body>
</html>
