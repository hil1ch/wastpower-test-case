<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght,CRSV@100..900,0&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>ВкусДом</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header-top">
          <a class="header-logo-link" href="#">
            <img
              class="logo"
              src="public\header\Logo_Primary.svg"
              alt="Логотип"
            />
          </a>
          <div class="search-wrap">
            <button class="catalog-btn">
              <img
                src="public\header\catalog.svg"
                alt="Иконка каталога"
              />Каталог
            </button>
            <img
              class="search-icon"
              src="public\header\search.svg"
              alt="Поиск"
            />
            <input class="search" type="text" placeholder="Поиск по сайту" />
          </div>
          <div class="header-actions">
            <button class="header-actions-item delivery-btn">
              <img
                src="public\header\geo.svg"
                alt="Иконка местоположения"
                class="delivery"
              />
              Укажите способ получения
            </button>
            <ul class="header-actions-list">
              <li class="header-actions-item favourite-link">
                <a
                  ><img
                    src="public\header\favourite.svg"
                    alt="Иконка избранных"
                /></a>
                <div class="favourite-count">1</div>
              </li>
              <li class="header-actions-item">
                <a class="header-action cart-link">
                  <img src="public\header\cart.svg" alt="Иконка корзины" />
                </a>
              </li>
              <li class="header-actions-item">
                <a class="header-action user-link">
                  <img src="public\header\user.svg" alt="Иконка пользователя" />
                </a>
              </li>
            </ul>
          </div>
        </div>
        <div class="header-menu">
          <ul class="header-menu-list">
            <li class="header-menu-item"><a href="#">Акции</a></li>
            <li class="header-menu-item"><a href="#">Хиты продаж</a></li>
            <li class="header-menu-item"><a href="#">Новинки</a></li>
            <li class="header-menu-item">
              <a href="#">Сделано в Чеченской республике</a>
            </li>
            <li class="header-menu-item"><a href="#">Готовая еда</a></li>
            <li class="header-menu-item">
              <a href="#">Собственное производство</a>
            </li>
            <li class="header-menu-item"><a href="#">Овощи и фрукты</a></li>
            <li class="header-menu-item"><a href="#">Мясо</a></li>
            <li class="header-menu-item"><a href="#">Рыба</a></li>
            <li class="header-menu-item"><a href="#">Сыры</a></li>
            <li class="header-menu-item"><a href="#">Хлеб</a></li>
          </ul>
        </div>
      </div>
    </header>
    <main></main>
    <footer></footer>
  </body>
</html>
